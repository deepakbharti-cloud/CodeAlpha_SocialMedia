<div class="card mb-3"><div class="card-body">
<a href="{% url 'profile' p.author.username %}" class="fw-bold text-decoration-none">@{{ p.author.username }}</a>
<small class="text-muted">{{ p.created|timesince }} ago</small><p class="mt-2">{{ p.text }}</p>
<a href="{% url 'like' p.pk %}" class="btn btn-sm {% if user in p.likes.all %}btn-danger{% else %}btn-outline-danger{% endif %}">♥ {{ p.likes.count }}</a>
<hr>{% for c in p.comments.all %}<div><b>{{ c.author.username }}</b>: {{ c.text }}</div>{% endfor %}
<form method="post" action="{% url 'comment' p.pk %}" class="d-flex gap-2 mt-2">{% csrf_token %}
<input name="text" class="form-control form-control-sm" placeholder="Write a comment..."><button class="btn btn-sm btn-dark">Send</button></form>
</div></div>

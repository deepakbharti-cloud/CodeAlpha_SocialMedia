{% extends 'base.html' %}{% block content %}<div class="col-md-6 mx-auto"><h4>People</h4>
<ul class="list-group">{% for x in users %}<li class="list-group-item d-flex justify-content-between"><a href="{% url 'profile' x.username %}">@{{ x.username }}</a><span class="text-muted">{{ x.profile.bio }}</span></li>{% empty %}<li class="list-group-item">No other users yet</li>{% endfor %}</ul></div>{% endblock %}
